<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />
    </pattern>

    <!-- Dynamic CSS Keyframes -->
    <style>
      @keyframes scan {
        0% { transform: translateY(-30px); opacity: 0; }
        20% { opacity: 0.85; }
        80% { opacity: 0.85; }
        100% { transform: translateY(350px); opacity: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.06); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -100; }
      }
      .scanner-line {
        animation: scan 5s ease-in-out infinite;
      }
      .floating-card {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .glow-orb {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .dashed-path {
        stroke-dasharray: 8 6;
        animation: dashAnim 4s linear infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />

  <!-- Blueprint Grid Overlay -->
  <rect width="1200" height="340" fill="url(#grid)" rx="16" opacity="0.8" />

  <!-- Decorative Glowing Orbs -->
  <circle cx="150" cy="80" r="140" fill="#3b82f6" opacity="0.15" filter="url(#softGlow)" class="glow-orb" />
  <circle cx="1050" cy="240" r="160" fill="#ec4899" opacity="0.12" filter="url(#softGlow)" class="glow-orb" style="animation-delay: 2s;" />
  <circle cx="650" cy="300" r="120" fill="#06b6d4" opacity="0.15" filter="url(#softGlow)" class="glow-orb" style="animation-delay: 1s;" />

  <!-- Construction Crane / Architectural Line Art (Right Side) -->
  <g opacity="0.35" transform="translate(900, 30)">
    <!-- Tower Crane Base & Mast -->
    <line x1="120" y1="280" x2="120" y2="40" stroke="#38bdf8" stroke-width="3" />
    <line x1="100" y1="280" x2="140" y2="280" stroke="#38bdf8" stroke-width="4" />
    <line x1="100" y1="40" x2="140" y2="40" stroke="#38bdf8" stroke-width="2" />
    <!-- Lattice work -->
    <path d="M 120 280 L 140 240 L 100 200 L 140 160 L 100 120 L 140 80 L 120 40" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 120 280 L 100 240 L 140 200 L 100 160 L 140 120 L 100 80 L 120 40" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Jib & Counter-Jib -->
    <line x1="20" y1="40" x2="250" y2="40" stroke="#38bdf8" stroke-width="3" />
    <line x1="120" y1="15" x2="120" y2="40" stroke="#38bdf8" stroke-width="2" />
    <line x1="120" y1="15" x2="20" y2="40" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="120" y1="15" x2="210" y2="40" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Counterweight -->
    <rect x="25" y="42" width="25" height="18" fill="#f59e0b" rx="2" />
    <!-- Trolley & Hook Line -->
    <rect x="180" y="38" width="12" height="6" fill="#ec4899" />
    <line x1="186" y1="44" x2="186" y2="120" stroke="#ec4899" stroke-width="1.5" class="dashed-path" />
    <!-- Suspended BIM Block -->
    <rect x="174" y="120" width="24" height="20" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Isometric Blueprint Cube / BIM element -->
  <g opacity="0.3" transform="translate(820, 180)">
    <polygon points="40,10 80,30 80,75 40,95 0,75 0,30" fill="none" stroke="#06b6d4" stroke-width="2" />
    <line x1="40" y1="10" x2="40" y2="95" stroke="#06b6d4" stroke-width="1.5" />
    <line x1="0" y1="30" x2="80" y2="75" stroke="#06b6d4" stroke-width="1" />
    <line x1="80" y1="30" x2="0" y2="75" stroke="#06b6d4" stroke-width="1" />
  </g>

  <!-- Animated Scanner Light Ray -->
  <g class="scanner-line">
    <line x1="40" y1="0" x2="1160" y2="0" stroke="url(#primaryGrad)" stroke-width="2" filter="url(#glow)" />
    <rect x="40" y="-15" width="1120" height="30" fill="url(#primaryGrad)" opacity="0.08" />
  </g>

  <!-- Left Header Icon: Hardhat + Digital Blueprint -->
  <g transform="translate(65, 60)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#glow)" />
    <!-- Hardhat -->
    <path d="M 20 48 C 20 33 28 22 38 22 C 48 22 56 33 56 48 Z" fill="url(#amberGrad)" />
    <path d="M 14 48 C 14 46 22 46 38 46 C 54 46 62 46 62 48 C 62 52 56 54 38 54 C 20 54 14 52 14 48 Z" fill="#f59e0b" />
    <rect x="35" y="22" width="6" height="24" fill="#d97706" rx="2" />
    <circle cx="38" cy="20" r="3" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Main Banner Typography -->
  <g transform="translate(160, 105)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, -32)">
      <rect x="0" y="0" width="265" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="14" cy="13" r="4" fill="#10b981">
        <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="17" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1" class="subtitle-text">CONSTRUCTION TECH 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="32" fill="#ffffff" font-size="34" class="title-text" filter="url(#glow)">
      Awesome <tspan fill="url(#primaryGrad)">Construction Field</tspan> Management
    </text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="70" fill="#cbd5e1" font-size="15.5" class="subtitle-text">
      🏗️ The Ultimate Curated Index of SaaS Platforms &amp; Open-Source Jobsite Tools
    </text>

    <!-- Subtitle Line 2 / Feature Badges -->
    <g transform="translate(0, 96)">
      <!-- Pill 1: Daily Logs & RFIs -->
      <rect x="0" y="0" width="145" height="26" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="17" fill="#38bdf8" font-size="11.5" font-weight="600" class="subtitle-text">📋 Daily Logs &amp; Tasks</text>

      <!-- Pill 2: Plan Viewing & BIM -->
      <rect x="155" y="0" width="145" height="26" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="167" y="17" fill="#a855f7" font-size="11.5" font-weight="600" class="subtitle-text">📐 Plan View &amp; BIM</text>

      <!-- Pill 3: Safety & HSE -->
      <rect x="310" y="0" width="145" height="26" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="322" y="17" fill="#fbbf24" font-size="11.5" font-weight="600" class="subtitle-text">⛑️ Safety &amp; Quality</text>

      <!-- Pill 4: Time & Crew GPS -->
      <rect x="465" y="0" width="155" height="26" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="477" y="17" fill="#34d399" font-size="11.5" font-weight="600" class="subtitle-text">⏱️ Crew GPS &amp; Hours</text>
    </g>
  </g>

  <!-- Bottom Border Highlight -->
  <rect x="0" y="336" width="1200" height="4" fill="url(#primaryGrad)" rx="2" />
</svg>
